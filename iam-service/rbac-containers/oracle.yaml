# Oracle
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-iam
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: iam
      APP_USER_PASSWORD: mile123_A
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
