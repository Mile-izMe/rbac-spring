# Oracle
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-iam
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:?missing in .env}
      APP_USER: iam
      APP_USER_PASSWORD: ${DB_PASSWORD:?missing in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
